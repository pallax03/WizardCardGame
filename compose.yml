services:
  redis:
    image: redis:7-alpine
    container_name: wizard-card-game-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: always

  wizard-engine:
    image: ${ENGINE_IMAGE:-wizard-engine:local}
    build:
      context: ./wizardEngine
    container_name: wizard-card-game-wizard-engine
    ports:
      - "${HTTP_PORT:-5001}:${HTTP_PORT:-5001}"
      - "${WS_PORT:-5002}:${WS_PORT:-5002}"
    environment:
      - ROLE=engine
      - APP_ENV=${APP_ENV:-development}
      - HTTP_PORT=${HTTP_PORT:-5001}
      - WS_PORT=${WS_PORT:-5002}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
    restart: on-failure

  wizard-bot-worker:
    image: ${ENGINE_IMAGE:-wizard-engine:local}
    build:
      context: ./wizardEngine
    environment:
      - ROLE=bot_worker
      - APP_ENV=${APP_ENV:-development}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    depends_on:
      - redis
      - wizard-engine
    restart: on-failure
    deploy:
      replicas: 3

  application:
    build:
      context: ./application
    container_name: wizard-card-game-application
    profiles: ["frontend"]
    ports:
      - "${APPLICATION_PORT:-3000}:${APPLICATION_PORT:-3000}"
    environment:
      - PORT=${APPLICATION_PORT:-3000}
      - BACKEND_INTERNAL_URL=http://wizard-engine:${HTTP_PORT:-5001}
      - NEXT_PUBLIC_WS_PORT=${WS_PORT:-5002}
    depends_on:
      - wizard-engine
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: wizard-card-game-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - wizard-engine

volumes:
  redis-data:
  caddy_data:
  caddy_config:
