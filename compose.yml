services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: always

  wizard-engine:
    build:
      context: ./wizardEngine
    container_name: ${PROJECT_NAME}-wizard-engine
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "${WS_PORT}:${WS_PORT}"
    environment:
      - ROLE=engine
      - APP_ENV=${APP_ENV}
      - HTTP_PORT=${HTTP_PORT}
      - WS_PORT=${WS_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      - redis
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Bot workers – stateless, horizontally scalable.
  #
  # Scale independently of the engine with:
  #   docker compose up --scale wizard-bot-worker=3
  #
  # Each replica registers itself as a distinct consumer in the "bot_workers"
  # Redis Streams Consumer Group. Redis guarantees that each task is delivered
  # to exactly one replica, so no distributed lock is needed.
  #
  # BOT_DELAY_MS: milliseconds the bot "thinks" before playing (default 3000).
  # ---------------------------------------------------------------------------
  wizard-bot-worker:
    build:
      context: ./wizardEngine
    environment:
      - ROLE=bot_worker
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - BOT_DELAY_MS=${BOT_DELAY_MS:-3000}
    depends_on:
      - redis
      - wizard-engine
    restart: on-failure
    deploy:
      replicas: 3

  application:
    build:
      context: ./application
    container_name: ${PROJECT_NAME}-application
    ports:
      - "${APPLICATION_PORT}:${APPLICATION_PORT}"
    environment:
      - PORT=${APPLICATION_PORT}
      - BACKEND_INTERNAL_URL=http://wizard-engine:${HTTP_PORT}
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:${HTTP_PORT}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${WS_PORT}
    depends_on:
      - wizard-engine
    restart: always

volumes:
  redis-data:
