services:
  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME}-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: always

  wizard-engine:
    build:
      context: ./wizardEngine
    container_name: ${PROJECT_NAME}-wizard-engine
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
      - "${WS_PORT}:${WS_PORT}"
    environment:
      - APP_ENV=${APP_ENV}
      - HTTP_PORT=${HTTP_PORT}
      - WS_PORT=${WS_PORT}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
    command: ["-redis"]
    depends_on:
      - redis
    restart: on-failure

  application:
    build:
      context: ./application
    container_name: ${PROJECT_NAME}-application
    ports:
      - "${APPLICATION_PORT}:${APPLICATION_PORT}"
    environment:
      - PORT=${APPLICATION_PORT}
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:${HTTP_PORT}
      - NEXT_PUBLIC_WS_URL=ws://localhost:${WS_PORT}
    depends_on:
      - wizard-engine
    restart: always
  
  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME}-prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME}-grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      - prometheus
    restart: always

volumes:
  redis-data: