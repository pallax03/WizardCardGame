name: Wizard-Engine CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'wizardEngine/**'
              - '.github/workflows/ci-wizard_engine.yml'

  wizard-engine-test:
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      
      - name: Install SBT
        uses: sbt/setup-sbt@v1

      - name: SBT Format & Fix Check
        if: github.base_ref == 'master' || github.ref == 'refs/heads/master'
        working-directory: ./wizardEngine
        run: sbt "; scalafmtCheckAll; scalafixAll --check"

      - name: SBT Compile, Test & Coverage
        working-directory: ./wizardEngine
        run: sbt "; coverage; test; coverageReport"
