name: Deploy Backend

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment ignoring file filters'
        required: false
        type: boolean
        default: true

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  changes:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_deploy) }}
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve previous release tag
        id: prev
        run: echo "tag=$(git describe --tags --abbrev=0 HEAD^)" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ steps.prev.outputs.tag }}
          filters: |
            backend:
              - 'wizardEngine/**'
              - 'compose.yml'
              - 'Caddyfile'
              - '.github/workflows/deploy.yml'

  deploy:
    needs: changes
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.backend == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_deploy)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-engine
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./wizardEngine
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USERNAME }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ~/WizardCardGame
            git pull --ff-only origin master
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile

  notify-failure:
    needs: [changes, deploy]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$REPO" \
            --title "fix(deploy): Deploy Backend workflow failed ($REF_NAME)" \
            --body "The **Deploy Backend** workflow failed for \`$REF_NAME\`. Inspect logs: $RUN_URL" \
            --label "area:devops" \
            --assignee "pallax03"
