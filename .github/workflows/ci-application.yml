name: Application CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - 'application/**'
      - '.github/workflows/ci-application.yml'
  pull_request:
    branches:
      - master
      - develop
    paths:
      - 'application/**'

jobs:
  application-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        working-directory: ./application
        run: npm ci

      - name: Lint
        working-directory: ./application
        run: npm run lint

      - name: Build Next.js
        working-directory: ./application
        run: npm run build
