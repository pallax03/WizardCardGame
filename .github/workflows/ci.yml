name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          working-directory: ./application

      - name: Check & Build Application
        working-directory: ./application
        run: |
          npm run check
          npm run build

  wizard-engine-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup JVM & sbt
        uses: ./.github/actions/setup-jvm

      - name: Check Engine (Format, Lint, Test & Coverage)
        working-directory: ./wizardEngine
        run: sbt --batch check
