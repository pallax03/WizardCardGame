version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/application"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "application"
    groups:
      npm-safe-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "sbt"
    directory: "/wizardEngine"
    schedule:
      interval: "monthly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "wizardEngine"
    groups:
      sbt-safe-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"