name: "Task / Feature / DevOps"
description: "Plan a new domain feature, architectural refactor, CI/CD pipeline task, or documentation."
title: "<type>(<scope>): <short imperative summary>"
labels: ["triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "State what needs to be done and why."
      placeholder: "Briefly explain the goal, context, or user story..."
    validations:
      required: true

  - type: textarea
    id: dod
    attributes:
      label: "Definition of Done (DoD)"
      description: "Task-specific completion criteria (optional)."
      placeholder: |
        - [ ] Specific verifiable outcome 1
        - [ ] Specific verifiable outcome 2
    validations:
      required: false
