name: "Task / Feature / DevOps"
description: "Plan a new domain feature, architectural refactor, CI/CD pipeline task, or documentation."
title: "<type>(<scope>): <short imperative summary>"
labels: ["triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "Describe what needs to be implemented or improved, and the motivation behind it."
      placeholder: "Briefly explain the goal, expected changes, or context..."
    validations:
      required: true

  - type: checkboxes
    id: dod
    attributes:
      label: "Definition of Done (DoD)"
      description: "Criteria required to merge the Pull Request and close this issue:"
      options:
        - label: "Code compiles and passes static analysis (`scalafmt`/`scalafix` or `eslint`/`tsc`)."
          required: true
        - label: "Commits are atomic and strictly follow `<type>(<scope>): <summary>`."
          required: true
        - label: "Unit or integration tests cover the new logic / regression."
          required: true
        - label: "Relevant documentation, OpenAPI specs, or Astro report updated (if applicable)."
