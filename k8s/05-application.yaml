apiVersion: apps/v1
kind: Deployment
metadata:
  name: application
  labels:
    app: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application
  template:
    metadata:
      labels:
        app: application
    spec:
      containers:
      - name: application
        image: wizardcardgame-application:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: wizard-config
        env:
        - name: PORT
          value: "3000"
        - name: BACKEND_INTERNAL_URL
          value: "http://wizard-engine-service:5001"
        - name: NEXT_PUBLIC_WS_PORT
          value: "5002"
---
apiVersion: v1
kind: Service
metadata:
  name: application-service
spec:
  type: LoadBalancer
  selector:
    app: application
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30000
