# See https://scalameta.org/scalafmt/docs/configuration.html

version = 3.7.1
runner.dialect = scala3
project.git = true

preset = default
maxColumn = 100

rewrite.scala3 {
  convertToNewSyntax = true
  removeOptionalBraces = yes
}

fileOverride {
  "glob:**.sbt" {
    runner.dialect = scala212
    rewrite.scala3 {
      convertToNewSyntax = false
      removeOptionalBraces = no
    }
  }
  "glob:**/project/**" {
    runner.dialect = scala212
    rewrite.scala3 {
      convertToNewSyntax = false
      removeOptionalBraces = no
    }
  }
}

docstrings {
  style = Asterisk
  oneline = fold
  wrap = no
}
